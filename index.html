<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Multi-Stream Dashboard</title>
  <style>
    :root {
      --bg-main: #0c0d11;
      --bg-sidebar: #13141a;
      --bg-card: #1c1e27;
      --bg-card-hover: #262936;
      --bg-card-active: #2b3044;
      --border-color: #272a38;
      --accent-red: #ff334b;
      --accent-gold: #f59e0b;
      --text-main: #f1f2f6;
      --text-muted: #8b92a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Modal / Login Screen */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 9, 12, 0.94);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 380px;
      padding: 30px 24px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .login-card h2 {
      font-size: 1.35rem;
      margin-bottom: 6px;
      color: #fff;
    }

    .login-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .login-card input {
      width: 100%;
      padding: 10px 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 12px;
      outline: none;
      text-align: center;
    }

    .login-card input:focus {
      border-color: #556285;
    }

    .login-btn {
      width: 100%;
      padding: 10px;
      background: var(--accent-red);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .login-btn:hover { background: #e0243b; }

    .login-error {
      color: var(--accent-red);
      font-size: 0.8rem;
      margin-top: 10px;
      min-height: 18px;
    }

    /* Top Bar */
    header {
      height: 56px;
      background-color: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 16px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-live {
      background: var(--accent-red);
      color: #fff;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.75rem;
    }

    .badge-role {
      font-size: 0.72rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .role-admin {
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
    }

    .role-user {
      background: rgba(46, 204, 113, 0.2);
      color: #2ecc71;
      border: 1px solid #2ecc71;
    }

    .custom-link-container {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 520px;
      width: 100%;
    }

    .custom-link-container input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      padding: 7px 12px;
      font-size: 0.85rem;
      outline: none;
    }

    .custom-link-container input:focus { border-color: #556285; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background: #2b3044;
      color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover { background: #39405b; }

    .btn-danger {
      background: rgba(255, 51, 75, 0.15);
      border-color: var(--accent-red);
      color: var(--accent-red);
    }
    .btn-danger:hover { background: var(--accent-red); color: #fff; }

    .main-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left Sidebar */
    aside {
      width: 290px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 12px 14px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
    }

    /* Admin Add Streamer Box */
    .admin-form {
      padding: 12px;
      background: #181a24;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .admin-form input {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: #fff;
      border-radius: 4px;
      padding: 7px 8px;
      font-size: 0.8rem;
      outline: none;
    }

    .admin-form button {
      background: var(--accent-gold);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 7px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .streamer-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .streamer-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .streamer-item:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-color);
    }

    .streamer-item.active {
      border-color: var(--accent-red);
      background: var(--bg-card-active);
    }

    .streamer-avatar {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      background: #252836;
      flex-shrink: 0;
    }

    .streamer-info {
      flex: 1;
      min-width: 0;
    }

    .streamer-name {
      font-size: 0.85rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .streamer-status {
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
      color: var(--accent-red);
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-red);
      box-shadow: 0 0 6px var(--accent-red);
    }

    .streamer-actions {
      display: none;
      gap: 4px;
    }

    .is-admin .streamer-actions {
      display: flex;
    }

    .btn-action-icon {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: #fff;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.75rem;
    }

    .btn-action-icon:hover {
      background: var(--accent-gold);
      color: #000;
    }

    .btn-action-delete:hover {
      background: var(--accent-red);
      color: #fff;
    }

    .sidebar-footer {
      padding: 10px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* Grid Area */
    main {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      background: var(--bg-main);
      display: grid;
      gap: 10px;
      align-content: stretch;
    }

    .grid-0 { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); }
    .grid-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .grid-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .grid-5, .grid-6 { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; }
    .grid-7, .grid-8 { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; }

    .video-card {
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }

    .video-card-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 6px 10px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .video-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-card-header .btn-close {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      line-height: 1;
    }

    .video-card-header .btn-close:hover {
      background: var(--accent-red);
      border-color: var(--accent-red);
    }

    .video-card iframe {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
    }
  </style>
</head>
<body>

  <!-- Overlay Login -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <h2>MULTI-STREAM ACCESS</h2>
      <p>Silakan masukkan password untuk melanjutkan.</p>
      <input type="password" id="passwordInput" placeholder="Masukkan password..." onkeydown="if(event.key==='Enter') verifyLogin()" />
      <button class="login-btn" onclick="verifyLogin()">Masuk</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="brand-title">
      MULTI-STREAM <span class="badge-live">LIVE</span>
      <span id="roleBadge" class="badge-role"></span>
    </div>

    <!-- Paste Custom Link -->
    <div class="custom-link-container">
      <input type="text" id="customInput" placeholder="Paste link live YouTube saat ini (https://www.youtube.com/watch?v=...)" />
      <button class="btn" onclick="handleCustomLink()">+ Add Stream</button>
    </div>

    <div class="header-actions">
      <button class="btn btn-danger" onclick="clearAllStreams()">Clear Streams</button>
      <button class="btn" onclick="logout()">Logout</button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="main-wrapper">
    <!-- Sidebar Kiri -->
    <aside id="sidebarArea">
      <div class="sidebar-header">
        <span>Streamers</span>
      </div>

      <!-- Form Khusus Admin (Menambah Streamer Permanen) -->
      <div class="admin-form" id="adminForm" style="display: none;">
        <span style="font-size: 0.75rem; font-weight: 600; color: var(--accent-gold);">+ Tambah Streamer Permanen</span>
        <input type="text" id="newStreamerName" placeholder="Nama Streamer (Contoh: Ncang)" />
        <input type="text" id="newStreamerUrl" placeholder="Link Live YouTube saat ini / Video ID" />
        <input type="text" id="newStreamerAvatar" placeholder="Link Foto Profil (Opsional)" />
        <button onclick="addStreamerByAdmin()">Simpan Streamer</button>
      </div>

      <!-- Daftar Streamer -->
      <div class="streamer-list" id="streamerList"></div>

      <div class="sidebar-footer">
        <span style="font-size: 0.75rem; color: var(--text-muted); text-align: center;">Maksimal 8 Grid Stream</span>
      </div>
    </aside>

    <!-- Area Video Grid -->
    <main id="gridContainer" class="grid-0">
      <div>Pilih YouTuber di panel kiri atau paste link live di bagian atas.</div>
    </main>
  </div>

  <script>
    let streamers = [];
    function loadStreamers() {
      const saved = localStorage.getItem("multi_streamers_clean_v3");
      if (saved) {
        try {
          streamers = JSON.parse(saved);
        } catch (e) {
          streamers = [];
        }
      } else {
        streamers = [];
      }
    }

    function saveStreamers() {
      localStorage.setItem("multi_streamers_clean_v3", JSON.stringify(streamers));
    }

    let currentUserRole = null;
    let activeStreams = [];

    function verifyLogin() {
      const pass = document.getElementById("passwordInput").value.trim();
      const err = document.getElementById("loginError");

      if (pass === "opjterbaik") {
        currentUserRole = "admin";
      } else if (pass === "opjontop") {
        currentUserRole = "user";
      } else {
        err.innerText = "Password salah!";
        return;
      }

      sessionStorage.setItem("user_session_role", currentUserRole);
      applyLoginState();
    }

    function applyLoginState() {
      document.getElementById("loginOverlay").style.display = "none";
      const roleBadge = document.getElementById("roleBadge");
      const adminForm = document.getElementById("adminForm");
      const sidebarArea = document.getElementById("sidebarArea");

      if (currentUserRole === "admin") {
        roleBadge.className = "badge-role role-admin";
        roleBadge.innerText = "Admin";
        adminForm.style.display = "flex";
        sidebarArea.classList.add("is-admin");
      } else {
        roleBadge.className = "badge-role role-user";
        roleBadge.innerText = "Member";
        adminForm.style.display = "none";
        sidebarArea.classList.remove("is-admin");
      }

      renderSidebar();
    }

    function logout() {
      sessionStorage.removeItem("user_session_role");
      window.location.reload();
    }

    // Fungsi ekstraksi Video ID yang 100% didukung player YouTube
    function extractVideoId(input) {
      if (!input) return null;
      const str = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;

      try {
        const url = new URL(str);
        if (url.hostname.includes("youtube.com")) {
          if (url.searchParams.has("v")) return url.searchParams.get("v");
          if (url.pathname.includes("/live/")) return url.pathname.split("/live/")[1].split("/")[0].split("?")[0];
          if (url.pathname.includes("/embed/")) return url.pathname.split("/embed/")[1].split("/")[0].split("?")[0];
        } else if (url.hostname === "youtu.be") {
          return url.pathname.slice(1).split("?")[0];
        }
      } catch (e) {}

      return null;
    }

    function renderSidebar() {
      const listEl = document.getElementById("streamerList");
      listEl.innerHTML = "";

      if (streamers.length === 0) {
        listEl.innerHTML = `<div style="text-align:center; color:var(--text-muted); font-size:0.8rem; padding: 20px 0;">Belum ada streamer. ${currentUserRole === 'admin' ? 'Silakan tambahkan di form atas.' : ''}</div>`;
        return;
      }

      streamers.forEach(streamer => {
        const isActive = activeStreams.some(s => s.id === streamer.id);

        const card = document.createElement("div");
        card.className = `streamer-item ${isActive ? "active" : ""}`;

        card.onclick = (e) => {
          if (e.target.closest(".streamer-actions")) return;
          toggleStreamer(streamer);
        };

        card.innerHTML = `
          <img src="${streamer.avatar || 'https://via.placeholder.com/40'}" alt="${streamer.name}" class="streamer-avatar" onerror="this.src='https://via.placeholder.com/40'" />
          <div class="streamer-info">
            <div class="streamer-name">${streamer.name}</div>
            <div class="streamer-status">
              <span class="status-dot"></span>
              <span>Watch Live</span>
            </div>
          </div>
          <div class="streamer-actions">
            <button class="btn-action-icon" title="Update Link Live" onclick="editStreamerLive('${streamer.id}', event)">✏️</button>
            <button class="btn-action-icon btn-action-delete" title="Hapus Streamer" onclick="deleteStreamerByAdmin('${streamer.id}', event)">✕</button>
          </div>
        `;

        listEl.appendChild(card);
      });
    }

    // Toggle Streamer (Autoplay + Mute otomatis agar langsung menyala tanpa error)
    function toggleStreamer(streamer) {
      const existingIdx = activeStreams.findIndex(s => s.id === streamer.id);

      if (existingIdx !== -1) {
        activeStreams.splice(existingIdx, 1);
      } else {
        if (activeStreams.length >= 8) {
          alert("Maksimal 8 stream dalam satu layar!");
          return;
        }

        const videoId = streamer.videoId;
        if (!videoId) {
          alert(`Streamer ${streamer.name} belum memiliki video link aktif. Klik ikon pensil (✏️) untuk memasukkan link live-nya.`);
          return;
        }

        activeStreams.push({
          id: streamer.id,
          title: streamer.name,
          videoId: videoId
        });
      }

      renderSidebar();
      renderGrid();
    }

    // Admin Menambah Streamer
    function addStreamerByAdmin() {
      if (currentUserRole !== "admin") return;

      const nameInput = document.getElementById("newStreamerName");
      const urlInput = document.getElementById("newStreamerUrl");
      const avatarInput = document.getElementById("newStreamerAvatar");

      const name = nameInput.value.trim();
      const rawUrl = urlInput.value.trim();
      const avatar = avatarInput.value.trim() || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=252836&color=fff`;

      if (!name || !rawUrl) {
        alert("Nama dan Link Live YouTube wajib diisi!");
        return;
      }

      const vidId = extractVideoId(rawUrl);
      if (!vidId) {
        alert("Format link tidak valid! Masukkan link siaran live (contoh: https://www.youtube.com/watch?v=... atau https://youtube.com/live/...)");
        return;
      }

      const newId = "str_" + Date.now();
      streamers.push({
        id: newId,
        name: name,
        videoId: vidId,
        avatar: avatar
      });

      saveStreamers();
      nameInput.value = "";
      urlInput.value = "";
      avatarInput.value = "";

      renderSidebar();
      alert(`Streamer ${name} berhasil ditambahkan!`);
    }

    // Admin Update Link Live Streamer (Ikon Pensil)
    function editStreamerLive(streamerId, event) {
      event.stopPropagation();
      if (currentUserRole !== "admin") return;

      const st = streamers.find(s => s.id === streamerId);
      if (!st) return;

      const newUrl = prompt(`Update Link Live YouTube baru untuk ${st.name}:`, `https://www.youtube.com/watch?v=${st.videoId || ''}`);
      if (!newUrl) return;

      const vidId = extractVideoId(newUrl);
      if (!vidId) {
        alert("Link YouTube tidak valid!");
        return;
      }

      st.videoId = vidId;
      saveStreamers();

      // Jika sedang terbuka di grid, perbarui seketika
      const act = activeStreams.find(s => s.id === streamerId);
      if (act) act.videoId = vidId;

      renderSidebar();
      renderGrid();
    }

    // Admin Hapus Streamer
    function deleteStreamerByAdmin(streamerId, event) {
      event.stopPropagation();
      if (currentUserRole !== "admin") return;

      const target = streamers.find(s => s.id === streamerId);
      if (!confirm(`Hapus permanen streamer "${target?.name}"?`)) return;

      streamers = streamers.filter(s => s.id !== streamerId);
      saveStreamers();
      removeStream(streamerId);
      renderSidebar();
    }

    // Custom Link Handler (Bilah atas)
    function handleCustomLink() {
      const input = document.getElementById("customInput");
      const val = input.value.trim();
      if (!val) return;

      if (activeStreams.length >= 8) {
        alert("Maksimal 8 stream dalam satu layar!");
        return;
      }

      const videoId = extractVideoId(val);
      if (!videoId) {
        alert("Link tidak dikenali! Masukkan link live YouTube yang valid.");
        return;
      }

      activeStreams.push({
        id: "custom_" + Date.now(),
        title: "Live Stream (" + (activeStreams.length + 1) + ")",
        videoId: videoId
      });

      input.value = "";
      renderSidebar();
      renderGrid();
    }

    function removeStream(id) {
      activeStreams = activeStreams.filter(s => s.id !== id);
      renderSidebar();
      renderGrid();
    }

    function clearAllStreams() {
      activeStreams = [];
      renderSidebar();
      renderGrid();
    }

    // Render Grid Video dengan AutoPlay & Muted agar langsung jalan tanpa error
    function renderGrid() {
      const grid = document.getElementById("gridContainer");
      const count = activeStreams.length;

      grid.className = `grid-${count}`;

      if (count === 0) {
        grid.innerHTML = `<div>Pilih YouTuber di panel kiri atau paste link live di bagian atas.</div>`;
        return;
      }

      grid.innerHTML = "";
      activeStreams.forEach(stream => {
        // Parameter autoplay=1 dan mute=1 adalah syarat browser agar video langsung berputar otomatis tanpa diblokir
        const embedUrl = `https://www.youtube-nocookie.com/embed/${stream.videoId}?autoplay=1&mute=1&playsinline=1`;
        const card = document.createElement("div");
        card.className = "video-card";
        card.innerHTML = `
          <div class="video-card-header">
            <span class="video-title">${stream.title}</span>
            <button class="btn-close" onclick="removeStream('${stream.id}')" title="Close">✕</button>
          </div>
          <iframe 
            src="${embedUrl}" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        `;
        grid.appendChild(card);
      });
    }

    // Inisialisasi awal
    loadStreamers();
    const existingSession = sessionStorage.getItem("user_session_role");
    if (existingSession === "admin" || existingSession === "user") {
      currentUserRole = existingSession;
      applyLoginState();
    }
  </script>
