<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Stream Dashboard</title>
  <style>
    :root {
      --bg-main: #0c0d11;
      --bg-sidebar: #13141a;
      --bg-card: #1c1e27;
      --bg-card-hover: #262936;
      --bg-card-active: #2b3044;
      --border-color: #272a38;
      --accent-red: #ff334b;
      --accent-green: #2ecc71;
      --text-main: #f1f2f6;
      --text-muted: #8b92a5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      height: 56px;
      background-color: var(--bg-sidebar);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 16px;
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span {
      background: var(--accent-red);
      color: #fff;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }

    .custom-link-container {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 550px;
      width: 100%;
    }

    .custom-link-container input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      padding: 7px 12px;
      font-size: 0.85rem;
      outline: none;
    }

    .custom-link-container input:focus {
      border-color: #556285;
    }

    .btn {
      background: #2b3044;
      color: #fff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #39405b;
    }

    .btn-danger {
      background: rgba(255, 51, 75, 0.15);
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .btn-danger:hover {
      background: var(--accent-red);
      color: #fff;
    }

    .main-wrapper {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    aside {
      width: 270px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 12px 14px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .streamer-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .streamer-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 10px;
      background: var(--bg-card);
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s;
    }

    .streamer-item:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-color);
    }

    .streamer-item.active {
      border-color: #4f5b82;
      background: var(--bg-card-active);
    }

    .streamer-avatar {
      width: 38px;
      height: 38px;
      border-radius: 6px;
      object-fit: cover;
      background: #252836;
      flex-shrink: 0;
    }

    .streamer-info {
      flex: 1;
      min-width: 0;
    }

    .streamer-name {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .streamer-status {
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 2px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .streamer-status.live .status-dot {
      background: var(--accent-red);
      box-shadow: 0 0 6px var(--accent-red);
    }

    .streamer-status.live {
      color: var(--accent-red);
      font-weight: 600;
    }

    .streamer-status.offline {
      color: var(--text-muted);
    }

    .sidebar-footer {
      padding: 10px;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    main {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      background: var(--bg-main);
      display: grid;
      gap: 10px;
      align-content: stretch;
    }

    .grid-0 { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); }
    .grid-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .grid-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
    .grid-5, .grid-6 { grid-template-columns: repeat(3, 1fr); grid-template-rows: 1fr 1fr; }
    .grid-7, .grid-8 { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr 1fr; }

    .video-card {
      position: relative;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      min-height: 200px;
    }

    .video-card-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 6px 10px;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: none;
    }

    .video-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-card-header .btn-close {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      line-height: 1;
    }

    .video-card-header .btn-close:hover {
      background: var(--accent-red);
      border-color: var(--accent-red);
    }

    .video-card iframe {
      width: 100%;
      height: 100%;
      border: none;
      flex: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      MULTI-STREAM <span>LIVE</span>
    </div>

    <div class="custom-link-container">
      <input type="text" id="customInput" placeholder="Paste link live (contoh: https://www.youtube.com/watch?v=... atau ID)" />
      <button class="btn" onclick="handleCustomLink()">+ Add Stream</button>
    </div>

    <div>
      <button class="btn btn-danger" onclick="clearAllStreams()">Clear Streams</button>
    </div>
  </header>

  <div class="main-wrapper">
    <aside>
      <div class="sidebar-header">
        <span>Streamers</span>
        <button class="btn" style="padding: 2px 8px; font-size: 0.7rem;" onclick="checkAllStatus()">Refresh Live</button>
      </div>
      <div class="streamer-list" id="streamerList"></div>
      <div class="sidebar-footer">
        <span style="font-size: 0.75rem; color: var(--text-muted); text-align: center;">Maksimal 8 Grid Stream</span>
      </div>
    </aside>

    <main id="gridContainer" class="grid-0">
      <div>Pilih YouTuber di panel kiri atau paste link live di bagian atas.</div>
    </main>
  </div>

  <script>
    // Masukkan Channel ID resmi (UCxxxxxx) atau default video ID live mereka
    const DEFAULT_STREAMERS = [
      { id: "streamer_1", name: "Sipije", channelId: "UCgE3W677i8xJ8vV5e3L9f3Q", handle: "sipijee", avatar: "https://images.unsplash.com/photo-1566492031773-4f4e44671857?w=100&h=100&fit=crop" },
      { id: "streamer_2", name: "Risky Prabu", channelId: "", handle: "RiskyPrabu", avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop" },
      { id: "streamer_3", name: "Dobori Tensha VT", channelId: "", handle: "DoboriTensha", avatar: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=100&h=100&fit=crop" },
      { id: "streamer_4", name: "Jaka Triad", channelId: "", handle: "JakaTriad", avatar: "https://images.unsplash.com/photo-1527980965255-d3b416303d12?w=100&h=100&fit=crop" },
      { id: "streamer_5", name: "Cocis ent", channelId: "", handle: "Cocisent", avatar: "https://images.unsplash.com/photo-1580489944761-15a19d654956?w=100&h=100&fit=crop" },
      { id: "streamer_6", name: "dipanggilcuno", channelId: "", handle: "dipanggilcuno", avatar: "https://images.unsplash.com/photo-1628157582853-a796fa650a6a?w=100&h=100&fit=crop" },
      { id: "streamer_7", name: "Imed Mettu", channelId: "", handle: "ImedMettu", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100&h=100&fit=crop" },
      { id: "streamer_8", name: "Kevin Nugraha", channelId: "", handle: "KevinNugraha", avatar: "https://images.unsplash.com/photo-1624561172888-ac93c696e10c?w=100&h=100&fit=crop" },
      { id: "streamer_9", name: "AangKa25", channelId: "", handle: "AangKa25", avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100&h=100&fit=crop" }
    ];

    const streamerLiveStatus = {};
    let activeStreams = [];

    function renderSidebar() {
      const listEl = document.getElementById("streamerList");
      listEl.innerHTML = "";

      DEFAULT_STREAMERS.forEach(streamer => {
        const status = streamerLiveStatus[streamer.id] || "checking";
        const isActive = activeStreams.some(s => s.id === streamer.id);

        const card = document.createElement("div");
        card.className = `streamer-item ${isActive ? "active" : ""}`;
        card.onclick = () => toggleStreamer(streamer);

        card.innerHTML = `
          <img src="${streamer.avatar}" alt="${streamer.name}" class="streamer-avatar" onerror="this.src='https://via.placeholder.com/40'" />
          <div class="streamer-info">
            <div class="streamer-name">${streamer.name}</div>
            <div class="streamer-status ${status === 'live' ? 'live' : 'offline'}">
              <span class="status-dot"></span>
              <span>${status === 'live' ? 'Live' : (status === 'checking' ? 'Checking...' : 'Offline')}</span>
            </div>
          </div>
        `;

        listEl.appendChild(card);
      });
    }

    function toggleStreamer(streamer) {
      const existingIdx = activeStreams.findIndex(s => s.id === streamer.id);

      if (existingIdx !== -1) {
        activeStreams.splice(existingIdx, 1);
      } else {
        if (activeStreams.length >= 8) {
          alert("Maksimal 8 stream dalam satu layar!");
          return;
        }

        // Jika streamer memiliki videoId langsung atau Channel ID
        let embedSrc = "";
        if (streamer.videoId) {
          embedSrc = `https://www.youtube.com/embed/${streamer.videoId}?autoplay=1`;
        } else if (streamer.channelId) {
          embedSrc = `https://www.youtube.com/embed/live_stream?channel=${streamer.channelId}&autoplay=1`;
        } else {
          // Fallback bila channel ID belum diisi: meminta link live aktif
          const promptUrl = prompt(`Masukkan link live YouTube untuk ${streamer.name}:`);
          if (!promptUrl) return;
          embedSrc = extractEmbedUrl(promptUrl);
        }

        if (embedSrc) {
          activeStreams.push({
            id: streamer.id,
            title: streamer.name,
            embedUrl: embedSrc
          });
        }
      }

      renderSidebar();
      renderGrid();
    }

    function extractEmbedUrl(inputStr) {
      if (!inputStr) return null;
      const trimmed = inputStr.trim();

      // Jika format adalah 11 digit Video ID langsung
      if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) {
        return `https://www.youtube.com/embed/${trimmed}?autoplay=1`;
      }

      // Deteksi URL YouTube
      try {
        const url = new URL(trimmed);
        if (url.hostname.includes("youtube.com")) {
          if (url.searchParams.has("v")) {
            return `https://www.youtube.com/embed/${url.searchParams.get("v")}?autoplay=1`;
          }
          if (url.pathname.includes("/live/")) {
            const id = url.pathname.split("/live/")[1].split("/")[0].split("?")[0];
            return `https://www.youtube.com/embed/${id}?autoplay=1`;
          }
          if (url.pathname.includes("/embed/")) {
            return trimmed;
          }
        } else if (url.hostname === "youtu.be") {
          const id = url.pathname.slice(1).split("?")[0];
          return `https://www.youtube.com/embed/${id}?autoplay=1`;
        }
      } catch (e) {
        // Bukan format valid
      }

      return null;
    }

    function handleCustomLink() {
      const input = document.getElementById("customInput");
      const val = input.value.trim();
      if (!val) return;

      if (activeStreams.length >= 8) {
        alert("Maksimal 8 stream dalam satu layar!");
        return;
      }

      const embedUrl = extractEmbedUrl(val);
      if (!embedUrl) {
        alert("Link YouTube tidak valid. Gunakan format: https://www.youtube.com/watch?v=... atau https://youtu.be/...");
        return;
      }

      const customId = "custom_" + Date.now();
      activeStreams.push({
        id: customId,
        title: "Live Stream (" + (activeStreams.length + 1) + ")",
        embedUrl: embedUrl
      });

      input.value = "";
      renderSidebar();
      renderGrid();
    }

    function removeStream(id) {
      activeStreams = activeStreams.filter(s => s.id !== id);
      renderSidebar();
      renderGrid();
    }

    function clearAllStreams() {
      activeStreams = [];
      renderSidebar();
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById("gridContainer");
      const count = activeStreams.length;

      grid.className = `grid-${count}`;

      if (count === 0) {
        grid.innerHTML = `<div>Pilih YouTuber di panel kiri atau paste link live di bagian atas.</div>`;
        return;
      }

      grid.innerHTML = "";
      activeStreams.forEach(stream => {
        const card = document.createElement("div");
        card.className = "video-card";
        card.innerHTML = `
          <div class="video-card-header">
            <span class="video-title">${stream.title}</span>
            <button class="btn-close" onclick="removeStream('${stream.id}')" title="Close">✕</button>
          </div>
          <iframe 
            src="${stream.embedUrl}" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        `;
        grid.appendChild(card);
      });
    }

    async function checkAllStatus() {
      DEFAULT_STREAMERS.forEach(async (streamer) => {
        streamerLiveStatus[streamer.id] = "checking";
        renderSidebar();

        try {
          const targetUrl = `https://www.youtube.com/@${streamer.handle}/live`;
          const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
          const response = await fetch(proxyUrl);
          if (response.ok) {
            const html = await response.text();
            const isLive = html.includes('"isLive":true') || (html.includes('isLiveBroadcast') && !html.includes('LIVE_STREAM_OFFLINE'));
            streamerLiveStatus[streamer.id] = isLive ? "live" : "offline";
          } else {
            streamerLiveStatus[streamer.id] = "offline";
          }
        } catch (e) {
          streamerLiveStatus[streamer.id] = "offline";
        }
        renderSidebar();
      });
    }

    renderSidebar();
    checkAllStatus();
  </script>
</body>
</html>
